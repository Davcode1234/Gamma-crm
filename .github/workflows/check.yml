name: Check

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  check:
    name: ✅ ${{ matrix.task }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        task: [lint, tsc, test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # Bezpiecznik na Twój konkretny błąd z cacache (opcjonalnie, ale praktyczne)
      - name: Clean npm cache if corrupted
        run: rm -rf ~/.npm/_cacache

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.task }}
        run: npm run ${{ matrix.task }}
